[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-content-agent-creator"
version = "0.1.0"
description = "Plataforma de agentes de IA para produção e planejamento audiovisual a partir de briefing estruturado"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "google-genai>=0.1.1",
    "python-dotenv>=1.0.1",
    "typer[all]>=0.12.3",
    "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
video-agent = "api.cli.main:app"
